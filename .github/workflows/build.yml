name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q *.zip -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100

      - name: Find project
        run: |
          SETTINGS=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
- name: Show MainActivity
  run: |
    FILE=$(find "$PROJECT_DIR" -type f -name "MainActivity.kt" | head -1)
    echo "MainActivity: $FILE"
    nl -ba "$FILE" | sed -n '100,140p'
  - name: Fix Android build configuration
        run: |
          echo "Project directory: $PROJECT_DIR"

          echo "Before changes:"
          grep -RIn \
            -E 'com.android.application|com.android.library|compileSdk|compileSdkVersion|8\.6\.1' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            2>/dev/null || true

          # Update Android Gradle Plugin 8.6.1 -> 8.10.0
          find "$PROJECT_DIR" -type f \( \
            -name "*.gradle" -o \
            -name "*.gradle.kts" -o \
            -name "*.toml" \
          \) -print0 | while IFS= read -r -d '' file; do

            sed -i \
              -E 's/(com\.android\.(application|library)[^"]*version[[:space:]]*[=]?[[:space:]]*["'\''])8\.6\.1(["'\''])/\18.10.0\2/g' \
              "$file" 2>/dev/null || true

            sed -i \
              -E 's/(agp[[:space:]]*=[[:space:]]*["'\''])8\.6\.1(["'\''])/\18.10.0\2/g' \
              "$file" 2>/dev/null || true

          done

          # Force compileSdk 36
          find "$PROJECT_DIR" -type f \( \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print0 | while IFS= read -r -d '' file; do

            sed -i -E \
              's/(compileSdk[[:space:]]*[=]?[[:space:]]*)[0-9]+/\136/g' \
              "$file" 2>/dev/null || true

            sed -i -E \
              's/(compileSdkVersion[[:space:]]+)[0-9]+/\136/g' \
              "$file" 2>/dev/null || true

          done

          echo "After changes:"
          grep -RIn \
            -E 'com.android.application|com.android.library|compileSdk|compileSdkVersion|8\.10\.0' \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            2>/dev/null || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
